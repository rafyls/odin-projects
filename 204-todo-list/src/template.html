<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>TickList</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer">
  </head>
  <body>
    <div class="sidebar">
      <div class="mainHeading">
        <i class="fa-solid fa-clipboard-list mainHeading-icon" style="font-size: 2.75rem;"></i>
        <h1 class="mainHeading-text">TickList</h1>
      </div>
      <button class="addNewTaskButton">
        <i class="fa-solid fa-square-plus addNewTaskButton-icon" style="font-size: 1.55rem;"></i>
        Add New Task
      </button>
      <h2>Projects</h2>
      <button class="todayProjectButton">
        <i class="fa-solid fa-calendar-check todayProjectButton-icon" style="font-size: 1.3rem;"></i>
        Today
      </button>
      <button class="newProjectButton">
        <i class="fa-solid fa-circle-plus newProjectButton-icon" style="font-size: 1.55rem;"></i>
        Add New Project
      </button>
    </div>
    <div class="mainContent">
      <h3 class="mainContent-projectName">Today</h3>
      <dialog class="newTaskDialog">
        <div class="newTaskDialog-heading">
          <h2>Add New Task</h2>
          <i class="fa-solid fa-circle-xmark fa-2x newTaskDialog-closeIcon"></i>
        </div>
        <form class="newTaskDialog-form" method="dialog">
          <label for="title">Title</label>
          <input type="text" id="title" required autofocus>
          <label for="description">Description</label>
          <textarea name="description" id="description" required></textarea>
          <label for="duedate">Due Date</label>
          <input type="date" id="duedate" name="duedate" required>
          <div class="newTaskDialog-radioGroup">
            <p>Priority</p>
            <div>
              <input type="radio" id="urgent" name="priority" value="Urgent" required>
              <label for="urgent">Urgent</label>
            </div>
            <div>
              <input type="radio" id="important" name="priority" value="Important">
              <label for="important">Important</label>
            </div>
            <div>
              <input type="radio" id="low" name="priority" value="Low">
              <label for="low">Low</label>
            </div>
          </div>
          <div class="newTaskDialog-buttons">
            <button type="reset" class="newTaskDialog-buttonsCancel" value="cancel">Cancel</button>
            <button type="submit" class="newTaskDialog-buttonsAdd" value="add">Add</button>
          </div>
        </form>
      </dialog>
      <dialog class="newTaskDialog newProjectDialog">
        <div class="newTaskDialog-heading">
          <h2>Add New Project</h2>
          <i class="fa-solid fa-circle-xmark fa-2x newTaskDialog-closeIcon"></i>
        </div>
        <form class="newTaskDialog-form newProjectDialog-form" method="dialog">
          <label for="titleProject">Project Name</label>
          <input type="text" id="titleProject" required autofocus>
          <div class="newTaskDialog-buttons newProjectDialog-buttons">
            <button type="reset" class="newTaskDialog-buttonsCancel" value="cancel">Cancel</button>
            <button type="submit" class="newTaskDialog-buttonsAdd" value="add">Add</button>
          </div>
        </form>
      </dialog>
    </div>
  </body>
</html>
