<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>TickList</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer">
  </head>
  <body>
    <div class="sidebar">
      <div class="mainHeading">
        <i class="fa-solid fa-clipboard-list mainHeading-icon" style="font-size: 2.75rem;"></i>
        <h1 class="mainHeading-text">TickList</h1>
      </div>
      <button class="addNewTaskButton">
        <i class="fa-solid fa-square-plus addNewTaskButton-icon" style="font-size: 1.55rem;"></i>
        Add New Task
      </button>
      <h2>Projects</h2>
      <button class="todayProjectButton">
        <i class="fa-solid fa-calendar-check todayProjectButton-icon" style="font-size: 1.3rem;"></i>
        Today
      </button>
      <button class="newProjectButton">
        <i class="fa-solid fa-circle-plus newProjectButton-icon" style="font-size: 1.55rem;"></i>
        Add New Project
      </button>
    </div>
    <div class="mainContent">
      <h3 class="mainContent-projectName">Today</h3>
      <div class="taskItem">
        <input type="checkbox" id="task-1">
        <label for="task-1" class="taskItem-title">Task 1</label>
        <button class="taskItem-detailsButton"><i class="fa-solid fa-ellipsis"></i></button>
        <button class="taskItem-modifyTaskButton"><i class="fa-solid fa-pen"></i></button>
        <button class="taskItem-deleteTaskButton"><i class="fa-solid fa-trash-can"></i></button>
      </div>
      <hr class="mainContent-sep">
      <div class="taskItem">
        <input type="checkbox" id="task-2">
        <label for="task-2" class="taskItem-title">Task 2</label>
        <div class="taskItem-details">
          <p class="taskItem-description">This paragraph is a description of Task 2.</p>
          <div class="taskItem-dateDetails">
            <div class="taskItem-duedate">
              <i class="fa-regular fa-calendar-days taskItem-duedateIcon"></i>
              <p>Sat, 6 Dec 2025</p>
            </div>
            <div class="taskItem-priority">
              <i class="fa-solid fa-list-ol taskItem-priorityIcon"></i>
              <p>Important</p>
            </div>
          </div>
        </div>
        <button class="taskItem-detailsButton"><i class="fa-solid fa-ellipsis"></i></button>
        <button class="taskItem-modifyTaskButton"><i class="fa-solid fa-pen"></i></button>
        <button class="taskItem-deleteTaskButton"><i class="fa-solid fa-trash-can"></i></button>
      </div>
      <hr class="mainContent-sep">
    </div>
  </body>
</html>
